<!--
Developed a simple, well-structured HTML webpage showcasing cat-related content. The project demonstrates the ability to create semantic web page layouts,
organise content using headings, lists and sections, embed images with accessibility features, and add hyperlinks to external websites. It reflects a 
solid understanding of fundamental HTML and web page structure.

Skills demonstrated:

HTML5
Semantic HTML
Web page structure and layout
Hyperlinks and navigation
Image embedding and accessibility (alt text)
Ordered and unordered lists
Basic content organisation
Understanding of HTML document structure
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>CatPhotoApp</title>
  </head>
  <body>
    <main>
      <h1>CatPhotoApp</h1>
      <section>
        <h2>Cat Photos</h2>
        <p>Everyone loves <a href="https://cdn.freecodecamp.org/curriculum/cat-photo-app/running-cats.jpg">cute cats</a> online!</p>
        <p>See more <a target="_blank" href="https://freecatphotoapp.com">cat photos</a> in our gallery.</p>
        <a href="https://freecatphotoapp.com"><img src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/relaxing-cat.jpg" alt="A cute orange cat lying on its back."></a>
      </section>
      <section>
        <h2>Cat Lists</h2>
        <h3>Things cats love:</h3>
        <ul>
          <li>Catnip</li>
          <li>Mice</li>
          <li>Climbing</li>
        </ul>
        <figure>
          <img src="https://cdn.corenexis.com/f/iFDMvTyBLad.jpg" alt="A kitten up a tree." width="400">
          <figcaption>Cats <em>love</em> to climb trees.</figcaption>  
        </figure>
        <h3>Top 3 things cats hate:</h3>
        <ol>
          <li>Getting wet</li>
          <li>Dogs</li>
          <li>Loud noises</li>
        </ol>
        <figure>
          <img src="https://cdn.corenexis.com/f/xZVYvL46RwL.jpg" alt="Angry looking wet cat." width="400">
          <figcaption>Cats <strong>hate</strong> getting wet.</figcaption>  
        </figure>
      </section>
    </main>
    <footer>
      <p>
        No Copyright - <a href="https://www.freecodecamp.org">freeCodeCamp.org</a>
      </p>
    </footer>
  </body>
</html>
